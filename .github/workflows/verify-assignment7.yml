name: Verify Assignment 7

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  automated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
            - name: Install required Node.js modules
        run: npm ci --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check server.js
          node --check models/userDB.js
      - name: Test MySQL model and Express routes (mock database)
        run: npm test
